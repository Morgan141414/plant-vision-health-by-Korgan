[project]
name = "plantvision-ai"
version = "0.1.0"
description = "Research prototype for local visual observations of urban vegetation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "opencv-python-headless>=4.10,<5",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]
ml = ["torch>=2.3", "ultralytics>=8.3", "onnxruntime>=1.18", "coremltools>=8"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
