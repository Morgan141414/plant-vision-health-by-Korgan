<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PlantVision AI</title><link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main>
    <header><p class="eyebrow">ИССЛЕДОВАТЕЛЬСКИЙ ПРОТОТИП</p><h1>PlantVision AI</h1><p>Наблюдение за городской растительностью по фото и видеопотоку</p></header>
    <section class="workspace">
      <label class="drop" for="file"><span>Загрузите фотографию растения</span><small>JPEG, PNG или WEBP</small><input id="file" type="file" accept="image/jpeg,image/png,image/webp"></label>
      <div id="preview" class="preview">Предпросмотр появится здесь</div>
      <button id="analyze" disabled>Выполнить наблюдение</button>
    </section>
    <section id="result" hidden aria-live="polite"><p class="eyebrow">РЕЗУЛЬТАТ</p><h2 id="status">REQUIRES REVIEW</h2><dl><div><dt>Растительный покров</dt><dd id="coverage">—</dd></div><div><dt>Зона на кадре</dt><dd id="bbox">—</dd></div><div><dt>Вид растения</dt><dd id="plant">Недоступно</dd></div><div><dt>Диагноз</dt><dd>Недоступно до валидации модели</dd></div></dl><p id="disclaimer" class="note"></p></section>
  </main><script src="/static/app.js"></script>
</body></html>
